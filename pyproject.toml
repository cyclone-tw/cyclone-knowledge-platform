[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclone-knowledge-platform"
version = "0.1.0"
description = "Private Knowledge Platform for the Cyclone-Wiki OKF migration"
requires-python = ">=3.12"
dependencies = [
  # The Gateway (Epic #1 / C3) will serve from this same app, so the skeleton
  # uses the real framework rather than a stand-in that would be replaced.
  "fastapi>=0.115",
  # Catalog parses only the source frontmatter it projects. A real YAML parser
  # keeps quoted/list/scalar semantics honest; duplicate keys are rejected by
  # the C3 strict loader rather than accepted with last-key-wins behavior.
  "PyYAML>=6.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "httpx>=0.27",  # required by fastapi.testclient.TestClient
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# defaults.toml is layer 0 of the config stack and the key schema; it must
# ship inside the wheel, not sit beside the source tree.
ckp = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
