[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclone-knowledge-platform"
version = "0.2.0"
description = "Private Knowledge Platform for the Cyclone-Wiki OKF migration"
requires-python = ">=3.12"
dependencies = [
  # The Gateway (Epic #1 / C3) will serve from this same app, so the skeleton
  # uses the real framework rather than a stand-in that would be replaced.
  "fastapi>=0.115",
  # Catalog parses only the source frontmatter it projects. A real YAML parser
  # keeps quoted/list/scalar semantics honest; duplicate keys are rejected by
  # the C3 strict loader rather than accepted with last-key-wins behavior.
  "PyYAML>=6.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# The Qdrant client stays out of the base dependencies and out of the runtime
# image on purpose (C5): the index is composed explicitly in tests, benchmarks,
# and container smoke, never by the default app. Client pinned to the same
# minor as the smoke/CI server image (qdrant/qdrant:v1.15.x).
index = [
  "qdrant-client>=1.14,<1.16",
]
# The semantic embedding inference stack (issue #25) stays out of the base
# dependencies and the runtime image on the same grounds as the ``index``
# extra above: composed explicitly in tests, benchmarks, and container
# smoke, never by the default app. No client-server split here -- these are
# the CPU inference libraries themselves -- but the principle is identical:
# a benchmark tool is not a runtime dependency. Pinned model weights are a
# separate, digest-verified download handled by
# ``scripts/fetch-semantic-model.sh``, not a package on this list.
semantic = [
  "onnxruntime>=1.18,<2",
  "tokenizers>=0.20,<1",
  "numpy>=1.26,<3",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "httpx>=0.27",  # required by fastapi.testclient.TestClient
]

[project.scripts]
ckp-wiki-capture = "ckp.writer.wiki_capture_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# defaults.toml is layer 0 of the config stack and the key schema; it must
# ship inside the wheel, not sit beside the source tree.
ckp = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
