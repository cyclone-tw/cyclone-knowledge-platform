# Layer 0 of the config stack: built-in defaults.
#
# This file also defines the *key schema*. A config file or environment
# variable naming a key that is absent here is rejected (ckp.config fails
# closed) -- a typo in an override must be loud, not silently ignored.
#
# Values here are deliberately host-agnostic. Anything host-specific arrives
# through a config file or the environment (AGENTS.md §7).

[profile]
# The Cyclone Profile version this deployment expects the bundle to conform
# to. Empty means "no expectation declared" -- the bundle's own descriptor is
# then the only source, and an undeclared bundle reports null.
expected_version = ""

[bundle]
# Relative paths resolve against the process working directory. The container
# sets WORKDIR so the default works there too.
root = "fixtures/synthetic-bundle"
note_glob = "**/*.md"

[server]
host = "127.0.0.1"
port = 8080

[pilot]
# P1 pilot corpus binding (issue #23): a read-only manifest over the *real*
# Cyclone-Wiki checkout, never a fixture. Empty `wiki_root` means "not
# configured" -- binding fails loudly (D5), it never falls back to a default
# or silently skips. Set via CKP_PILOT_WIKI_ROOT, never a literal host path
# in tracked source (AGENTS.md §7).
wiki_root = ""
# Relative to the process working directory, same convention as bundle.root.
manifest_path = "config/pilot-manifest.toml"
