name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The mutation matrices below are gated on `pull_request`
# (cyclone-agent-config#175). They are ~290s of the 3.14 job's ~340s -- the
# single largest line in this account's Actions bill. The `pull_request`
# trigger already builds and tests the merge commit, i.e. the exact tree that
# lands on main, so the push-to-main run re-executes mutation testing that was
# green minutes earlier. The PR gate is deliberately left at full strength:
# the unattended-ship loop merges on a green PR, so PR CI is the real gate and
# main CI is the duplicate. Tests, Lint and the container cold-rebuild still
# run on main as the standing health signal.
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Local-only Qdrant for the C5 integration tests. CKP_REQUIRE_QDRANT
      # turns the local "skip when unreachable" into a CI failure, so the
      # integration path can never silently stop running here.
      qdrant:
        image: qdrant/qdrant:v1.15.1
        ports:
          - 6333:6333
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the supported floor and what the container runs; 3.13+ is
        # what a developer's machine is likely to have. They are not
        # interchangeable: Path.glob raises from the call on 3.13+ and only
        # from the iterator on 3.12, which hid a real config-validation bug
        # that passed locally and failed here. Test both ends.
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install package with dev, index, and semantic extras
        run: python3 -m pip install --disable-pip-version-check -e ".[dev,index,semantic]"

      - name: Lint
        run: |
          python3 -m ruff check .
          python3 -m ruff format --check .

      - name: Cache the pinned semantic model assets
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/ckp-semantic-model
          # The manifest's pinned commit, copied by hand -- not computed from
          # src/ckp/semantic/manifest.py -- so a model swap or revision bump
          # there requires updating this literal too, or the cache simply
          # misses (R1 review, accepted non-blocking: the fetch step below
          # always re-verifies every file's sha256 against the manifest and
          # fails loudly on a mismatch, so a forgotten key bump can only
          # cost a cache miss and a ~5s re-download -- never a stale or
          # wrong model silently passing).
          key: ckp-semantic-model-75c43b069aac4d136ba6bc1122f995fedcfd2781

      - name: Fetch and verify the pinned semantic model (build-time only)
        env:
          CKP_SEMANTIC_MODEL_DIR: ${{ github.workspace }}/.cache/ckp-semantic-model
        run: bash scripts/fetch-semantic-model.sh

      - name: Tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          CKP_REQUIRE_QDRANT: "1"
          CKP_REQUIRE_SEMANTIC: "1"
          CKP_SEMANTIC_MODEL_DIR: ${{ github.workspace }}/.cache/ckp-semantic-model
        run: python3 -m pytest

      - name: C3 gateway mutation matrix
        if: matrix.python-version == '3.14' && github.event_name == 'pull_request'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: bash scripts/test-c3-mutations.sh

      - name: Lexical scorer mutation matrix (#66)
        if: matrix.python-version == '3.14' && github.event_name == 'pull_request'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: bash scripts/test-scorer-mutations.sh

      - name: C6 mutation matrix
        if: matrix.python-version == '3.14' && github.event_name == 'pull_request'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: bash scripts/test-c6-mutations.sh

      - name: C7 Writer mutation matrix
        if: matrix.python-version == '3.14' && github.event_name == 'pull_request'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: bash scripts/test-c7-mutations.sh

      - name: C8 outbox mutation matrix
        if: matrix.python-version == '3.14' && github.event_name == 'pull_request'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: bash scripts/test-c8-mutations.sh

      - name: C4 embedding mutation matrix
        if: matrix.python-version == '3.14' && github.event_name == 'pull_request'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: bash scripts/test-c4-mutations.sh

      - name: C5 index mutation matrix
        if: matrix.python-version == '3.14' && github.event_name == 'pull_request'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: bash scripts/test-c5-mutations.sh

      # Quoted because YAML starts a comment at " #": unquoted, this name
      # parsed as "Issue" and the rest was discarded, so the step showed up as
      # a bare "Issue" in the Actions UI and API (#73).
      - name: "Issue #25 semantic-provider mutation matrix"
        if: matrix.python-version == '3.14' && github.event_name == 'pull_request'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          # Without these two, the weight-gated __init__-wiring mutation
          # (R1 review round 2) would silently skip in CI instead of
          # actually being checked -- CKP_REQUIRE_SEMANTIC=1 turns a
          # missing/broken cache into a hard failure of this step instead.
          CKP_REQUIRE_SEMANTIC: "1"
          CKP_SEMANTIC_MODEL_DIR: ${{ github.workspace }}/.cache/ckp-semantic-model
        run: bash scripts/test-c25-semantic-mutations.sh

  container:
    # Contract Phase 8 wants a cold rebuild on a different host to be routine.
    # Building from a clean checkout on a hosted runner is the cheapest
    # standing proof that nothing in the package depends on a developer's box.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image and smoke the endpoints
        env:
          BUNDLE_COMMIT: ${{ github.sha }}
        run: bash scripts/smoke-container.sh
